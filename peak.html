<!DOCTYPE html>
<html lang="fr">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_02.png">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cohearium | Peak</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="vixy-page">
    <header class="page-header">
        <nav class="main-menu" aria-label="Menu principal">
            <a href="index.html">Accueil</a>
            <a class="active" href="lore.html" aria-current="page">Lore</a>
            <a href="roleplay.html">Roleplay</a>
            <a href="communaute.html">Communauté</a>
        </nav>
    </header>

    <div class="vixy-shell">
        <aside class="side-menu" aria-label="Sous-menu Vixy">
            <a href="vixy.html">Vixy</a>
            <a href="système.html">Système</a>
            <a class="current" href="territoires.html" aria-current="page">Territoires</a>
            <a href="races.html">Races</a>
        </aside>

        <main class="vixy-content">
            <p class="eyebrow">Territoires / 02</p>
            <h1>Peak</h1>
            <p class="intro">Les racines du passé.</p>

            <section class="lore-carousel" aria-label="Atlas des mondes liés à Peak">
                <div class="lore-carousel-heading">
                    <span class="lore-atlas-label">Atlas des mondes</span>
                    <span class="lore-live"><span aria-hidden="true"></span> Archives ouvertes</span>
                </div>

                <div class="lore-card">
                    <div class="lore-image">
                        <img id="lore-image" src="hexaria.jpg" alt="Hexaria">
                    </div>

                    <div class="lore-content">
                        <p class="lore-index" id="lore-index">Dossier 01 <span>/ 05</span></p>
                        <h2 id="lore-title"></h2>
                        <p id="lore-description"></p>
                        <span class="lore-origin">Peaks · Archives</span>
                    </div>

                    <span class="lore-coordinate" id="lore-coordinate" aria-hidden="true">C / 01</span>
                </div>

                <div class="lore-navigation">
                    <div class="lore-progress" aria-hidden="true"><span id="lore-progress-fill"></span></div>
                    <span id="lore-counter" aria-live="polite">01 <span>/ 05</span></span>
                    <div class="lore-arrows">
                        <button id="previous-button" type="button" aria-label="Monde précédent">←</button>
                        <button id="next-button" type="button" aria-label="Monde suivant">→</button>
                    </div>
                </div>

                <div class="lore-thumbnails" id="lore-thumbnails" role="group" aria-label="Choisir un monde"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
